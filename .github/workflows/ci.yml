name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' files < <(find . -type f -name '*.go' -not -path './vendor/*' -print0)
          if (( ${#files[@]} == 0 )); then
            exit 0
          fi

          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Detect Go packages
        id: packages
        shell: bash
        run: |
          if [[ -n "$(go list ./...)" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Go packages found; skipping vet, test, and build."
          fi

      - name: Run go vet
        if: steps.packages.outputs.found == 'true'
        run: go vet ./...

      - name: Run tests
        if: steps.packages.outputs.found == 'true'
        run: go test ./...

      - name: Build
        if: steps.packages.outputs.found == 'true'
        run: go build ./...
